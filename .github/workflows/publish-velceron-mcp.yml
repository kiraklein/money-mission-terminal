name: Publish Velceron to MCP Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "api/velceron/**"
      - "velceron-agent-gate/**"
      - ".github/workflows/publish-velceron-mcp.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check public MCP endpoint
        id: public
        shell: bash
        run: |
          set +e
          BODY=$(curl -sS --max-time 15 -o /tmp/mcp.out -w "%{http_code}"             -X POST "https://runwayzero-aegis-1435.vercel.app/api/velceron/mcp"             -H "content-type: application/json"             -H "accept: application/json, text/event-stream"             -d '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}')
          echo "status=$BODY" >> "$GITHUB_OUTPUT"
          if [ "$BODY" != "200" ]; then
            echo "Velceron is not public yet (HTTP $BODY). Skipping registry publish."
            exit 0
          fi
          grep -q '"result"' /tmp/mcp.out || { echo "MCP response was not valid."; exit 0; }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check whether already published
        if: steps.public.outputs.ready == 'true'
        id: existing
        shell: bash
        run: |
          JSON=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.kiraklein%2Fvelceron-agent-gate&version=latest")
          if echo "$JSON" | grep -q 'io.github.kiraklein/velceron-agent-gate'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.public.outputs.ready == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to MCP Registry
        if: steps.public.outputs.ready == 'true' && steps.existing.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish Velceron
        if: steps.public.outputs.ready == 'true' && steps.existing.outputs.exists != 'true'
        run: ./mcp-publisher publish velceron-agent-gate/server.json
